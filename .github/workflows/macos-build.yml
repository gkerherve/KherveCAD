name: macOS build

# PyInstaller cannot cross-compile, so the .app has to be produced on a
# Mac. Both architectures are built: macos-14 is Apple Silicon (arm64),
# macos-15-intel the x86_64 image.
#
# The engine used to force arm64 only. The last stable OpenSCAD (2021.01)
# predates Apple Silicon and is x86_64 only, so the engine comes from a
# nightly snapshot instead — and those ship a universal binary that runs
# natively on both. build_macos.py reads the extracted binary with `file`
# and refuses a slice that does not match the runner, so each DMG is
# native for the Mac it is named after.
#
# Not macos-13: that image was retired in December 2025 and the label no
# longer resolves, so a job asking for it queues for ever rather than
# failing. macos-15-intel is GitHub's last x86_64 image and goes away in
# August 2027, after which this matrix is arm64 only.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the DMGs"
        type: boolean
        default: true
      probe:
        description: "Report what OpenSCAD publishes, before building"
        type: boolean
        default: false
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false     # an Intel failure should not hide a good arm64 build
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The version is `git rev-list --count HEAD`, so a shallow
          # clone would silently ship the wrong build number.
          fetch-depth: 0

      - name: Probe what OpenSCAD publishes
        # A build machine can reach files.openscad.org; a laptop behind a
        # filtering proxy may not. This prints what is actually there —
        # which architecture the newest macOS image is, and where the
        # matching source lives — so the bundling rules can be based on
        # fact rather than on guessed filenames. Runs first and stops the
        # job, so its output is the whole log and nothing scrolls it away.
        if: inputs.probe
        run: |
          set -x
          INDEX=https://files.openscad.org/snapshots/
          curl -s "$INDEX" -o index.html
          echo "=== directories and non-binaries in the index ==="
          grep -oE 'href="[^"]+"' index.html | sed 's/href="//;s/"//' \
            | grep -vE '\.(exe|zip|AppImage|msi|deb|rpm|dmg)$' | tail -30
          echo "=== anything source-shaped ==="
          grep -oiE 'href="[^"]*(src|source|tar\.gz|tar\.xz)[^"]*"' index.html \
            | sort -u | tail -20
          NEWEST=$(grep -oE 'OpenSCAD-[0-9.]+\.dmg' index.html | sort -u | tail -1)
          echo "=== newest snapshot image: $NEWEST ==="
          curl -sL -o probe.dmg "$INDEX$NEWEST"
          hdiutil attach probe.dmg -nobrowse -readonly -mountpoint probe-mnt
          ls probe-mnt
          file probe-mnt/*.app/Contents/MacOS/*
          plutil -p probe-mnt/*.app/Contents/Info.plist | head -30
          hdiutil detach probe-mnt -force
          echo "probe only — stopping before the build"
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run the test suite
        # Offscreen Qt, and the engine forced off so no background
        # OpenSCAD renders are spawned on a headless runner.
        env:
          QT_QPA_PLATFORM: offscreen
          KHERVECAD_DISABLE_ENGINE: "1"
        run: python -m pytest tests/ -q

      - name: Build the .app and the DMG
        env:
          # Used only to resolve the OpenSCAD commit through the GitHub
          # API — runners share outbound IPs and the anonymous allowance
          # is small enough to fail a busy afternoon.
          GITHUB_TOKEN: ${{ github.token }}
        run: python packaging/build_macos.py

      - name: Read the version back
        # From the file the build stamped, not from git again, so the
        # artifact name cannot disagree with the app's own About box.
        run: echo "VERSION=$(cut -d+ -f1 khervecad/VERSION)" >> "$GITHUB_ENV"

      - name: Check the bundle
        # Not a launch test — a GUI app on a headless runner would just
        # hang. These are the things that can actually be wrong in a
        # finished bundle: no Info.plist, a broken signature, a version
        # that fell back to the 0.1.0 placeholder, a binary built for the
        # other architecture (users meet that as "the app is damaged"), or
        # the bundled engine missing, which surfaces as silently
        # approximate booleans.
        run: |
          set -euo pipefail
          APP=dist/KherveCAD.app
          test -x "$APP/Contents/MacOS/KherveCAD"
          plutil -p "$APP/Contents/Info.plist" \
            | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
          test "$VERSION" != "0.1.0"
          codesign --verify --deep --strict "$APP"
          file -b "$APP/Contents/MacOS/KherveCAD" | grep -q '${{ matrix.arch }}'
          test -x "$APP/Contents/Resources/openscad/OpenSCAD.app/Contents/MacOS/OpenSCAD"
          file -b "$APP/Contents/Resources/openscad/OpenSCAD.app/Contents/MacOS/OpenSCAD" \
            | grep -q '${{ matrix.arch }}'
          test -f "$APP/Contents/Resources/openscad/COPYING.txt"
          ls -1 dist/openscad-*.tar.gz

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: KherveCAD-${{ env.VERSION }}-macOS-${{ matrix.arch }}
          path: |
            dist/KherveCAD-*macOS-${{ matrix.arch }}.dmg
            dist/openscad-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # again: the version is the commit count

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Both jobs upload the OpenSCAD source; when they bundled the
          # same snapshot the two copies are the same file, and when a new
          # nightly landed between them both archives are attached.
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          # The version from the disk image's own name, so tag and assets
          # cannot disagree.
          VERSION=$(ls artifacts | sed -nE 's/^KherveCAD-([0-9.]+)-macOS-arm64\.dmg$/\1/p' | head -1)
          test -n "$VERSION"
          TAG="macos-v${VERSION}"

          # sed strips the YAML block indentation; without it every line of
          # the release notes would arrive with ten leading spaces and
          # render as a code block.
          sed 's/^          //' > notes.md <<'EOF'
          The macOS build of KherveCAD. Two native disk images:

          - `KherveCAD-*-macOS-arm64.dmg` — Apple Silicon (M1 and later)
          - `KherveCAD-*-macOS-x86_64.dmg` — Intel

          Open the DMG and drag KherveCAD to Applications. The app is *ad-hoc
          signed, not notarized*: macOS quarantines anything downloaded through
          a browser, so on first launch right-click the app and choose **Open**,
          then **Open** again — or run

              xattr -dr com.apple.quarantine /Applications/KherveCAD.app

          Later versions arrive through **Help > Check for Updates…**, which
          picks the disk image for your Mac's architecture.

          The **OpenSCAD engine is bundled inside the app**, so exact renders,
          booleans and STL export work with nothing else installed. OpenSCAD is
          GPL-2.0-or-later and KherveCAD runs it as a separate process; the
          corresponding source archive is attached to this release.

          Windows builds are released separately, under the `v*` tags.
          EOF

          # --latest=false keeps `releases/latest` pointing at the Windows
          # release: the website's download button is
          # releases/latest/download/KherveCAD-Setup.exe, and a macOS-only
          # release taking over "latest" would 404 that link.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --latest=false \
            --title "KherveCAD v${VERSION} — macOS (Apple Silicon and Intel)" \
            --notes-file notes.md
          gh release upload "$TAG" artifacts/*.dmg artifacts/openscad-*.tar.gz --clobber
